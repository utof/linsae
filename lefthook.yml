# Lefthook v2 pre-commit hooks (order matches CLAUDE.md ## Precommit).
# See: https://lefthook.dev/configuration/
pre-commit:
  parallel: false
  commands:
    biome:
      run: pnpm lint:check
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    knip:
      run: pnpm knip
    design-tokens:
      run: ./scripts/check-design-tokens.sh
