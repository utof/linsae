appId: com.utof.linsae
productName: linsae
directories:
  buildResources: build
# ALLOW-LIST, deliberately. The previous deny-list only excluded src/ and the
# tsconfigs, so every other repo-root path shipped inside app.asar: adrs/, docs/,
# scripts/, tests/, memory/, v21-design-system/, the agent-config dotdirs, and
# local_files/ — which contains a YouTube cookies file, i.e. live session
# credentials. A deny-list cannot be safe here: anything added to the repo root
# later ships by default. Only these three paths are needed at runtime.
#
# `main` is ./out/main/index.js; the renderer and preload bundles are under out/
# too. resources/ holds icon.png and is referenced by asarUnpack below.
# node_modules is NOT governed by this list — electron-builder builds that from
# the production `dependencies` graph, independently of `files`. See
# docs/specs/v0.8.1-housekeeping.md §3.1.
#
# NOTE on local_files/: src/main/yt-cookies.ts:24 resolves the cookies path from
# `process.cwd()` with a YT_COOKIES_FILE env override — cwd in a packaged app is
# the launch directory, never the asar — so excluding it here does not break the
# dev cookie path.
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: linsae
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: utof
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
