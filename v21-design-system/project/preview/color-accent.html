<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>color-accent</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root"><div class="row" style="width:100%;gap:18px;align-items:flex-start">
    <div style="flex:0 0 200px">
      <div style="height:80px;background:#0D99FF;border-radius:6px"></div>
      <div style="margin-top:8px;font-size:12px;font-family:var(--font-mono);color:var(--fg-1)">--accent</div>
      <div style="font-size:11px;font-family:var(--font-mono);color:var(--fg-3)">#0D99FF</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div class="row"><div style="width:24px;height:24px;background:#007BE5;border-radius:4px"></div><span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-1)">--accent-hover</span><span class="muted">#007BE5</span></div>
      <div class="row"><div style="width:24px;height:24px;background:#0064C2;border-radius:4px"></div><span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-1)">--accent-press</span><span class="muted">#0064C2</span></div>
      <div class="row"><div style="width:24px;height:24px;background:#E5F4FF;border-radius:4px;border:1px solid var(--border-0)"></div><span style="font-family:var(--font-mono);font-size:12px;color:var(--fg-1)">--accent-tint</span><span class="muted">#E5F4FF</span></div>
    </div>
    <div style="flex:0 0 auto;padding-left:18px;border-left:1px solid var(--border-0);align-self:stretch">
      <div class="muted" style="margin-bottom:6px">the only branded hue</div>
      <div style="font-size:13px;color:var(--fg-1);line-height:1.5;max-width:180px">used for selection, focus, the active link, and the unread dot. nothing else is blue.</div>
    </div>
  </div></div></body></html>
