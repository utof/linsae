<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root"><div class="col" style="gap:12px;width:100%">
    <div class="row" style="gap:10px">
      <button style="height:28px;padding:0 12px;background:#0D99FF;color:#fff;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">primary</button>
      <button style="height:28px;padding:0 12px;background:#F4F4F4;color:#1E1E1E;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">secondary</button>
      <button style="height:28px;padding:0 12px;background:transparent;color:#1E1E1E;border:1px solid #D9D9D9;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">outline</button>
      <button style="height:28px;padding:0 12px;background:transparent;color:#444;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">ghost</button>
      <button style="height:28px;padding:0 12px;background:#F4F4F4;color:#B3B3B3;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:not-allowed">disabled</button>
    </div>
    <div class="row" style="gap:10px;align-items:center">
      <button style="height:24px;padding:0 8px;background:#0D99FF;color:#fff;border:0;border-radius:4px;font:500 12px/1 var(--font-sans);cursor:pointer">sm</button>
      <button style="height:28px;padding:0 10px;background:#0D99FF;color:#fff;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">md</button>
      <button style="height:36px;padding:0 14px;background:#0D99FF;color:#fff;border:0;border-radius:4px;font:500 14px/1 var(--font-sans);cursor:pointer">lg</button>
      <span class="muted" style="margin-left:8px">sizes — 24 / 28 / 36</span>
    </div>
  </div></div></body></html>
