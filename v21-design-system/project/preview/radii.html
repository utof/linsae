<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root"><div class="col" style="gap:14px;width:100%">
    <div class="muted">corner radii — sharp by default, soft only on bubbles</div>
    <div class="row" style="gap:16px;align-items:flex-end">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:2px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">r-1</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">2px  ·  tag</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:4px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">r-2</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">4px  ·  input</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:6px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">r-3</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">6px  ·  card</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:10px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">r-4</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">10px  ·  modal</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:14px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">r-5</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">14px  ·  bubble</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:8px">
        <div style="width:56px;height:56px;background:#fff;border:1px solid var(--border-1);border-radius:999px"></div>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-1)">pill</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">999  ·  pill</span>
      </div>
    </div>
  </div></div></body></html>
