<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>sidebar-rows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root">
<div style="width:240px;background:var(--bg-1);border:1px solid var(--border-0);border-radius:8px;padding:6px">
  <div style="position:relative;display:flex;align-items:center;gap:8px;padding:0 10px;height:28px;border-radius:4px;background:var(--bg-3);font-size:13px;color:var(--fg-0);font-weight:500">
    <span style="position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:1px;background:#0D99FF"></span>
    today — jan 14
    <span style="margin-left:auto;font-size:11px;color:var(--fg-3);font-family:var(--font-mono)">active</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 10px;height:28px;font-size:13px;color:var(--fg-1)">
    inbox
    <span style="margin-left:auto;font-size:11px;color:var(--fg-2);font-family:var(--font-mono)">3</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 10px;height:28px;border-radius:4px;background:var(--bg-2);font-size:13px;color:var(--fg-1)">
    serre spectral sequences
    <span style="margin-left:auto;font-size:11px;color:var(--fg-3);font-family:var(--font-mono)">hover</span>
  </div>
  <div style="padding:14px 10px 4px 10px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-2);font-weight:500">saved searches</div>
  <div style="display:flex;align-items:center;gap:8px;padding:0 10px;height:28px;font-size:13px;color:var(--fg-1)">
    <span style="width:6px;height:6px;border-radius:50%;background:#F5A623"></span>
    open questions
    <span style="margin-left:auto;font-size:11px;color:var(--fg-2);font-family:var(--font-mono)">12</span>
  </div>
</div>
</div></body></html>
