<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>command-palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root">
<div style="width:520px;background:#fff;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,0.10),0 0 0 1px #E6E6E6;overflow:hidden">
  <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-0)">
    <span style="color:var(--fg-2);font-size:13px;display:inline-flex">🔍</span>
    <span style="flex:1;font-size:15px;color:var(--fg-3)">search, jump, capture…</span>
    <span style="font-family:var(--font-mono);font-size:11px;line-height:16px;padding:0 5px;height:18px;border-radius:2px;background:#F4F4F4;color:var(--fg-1);border:1px solid #E6E6E6;border-bottom-width:2px">esc</span>
  </div>
  <div style="padding:6px 6px 10px 6px">
    <div style="padding:10px 12px 4px 12px;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-2);font-weight:500">capture</div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;background:var(--bg-2);font-size:14px;color:var(--fg-0)">
      <span style="width:6px;height:6px;border-radius:50%;background:#F5A623"></span>
      <span style="flex:1">new question</span>
      <span style="font-family:var(--font-mono);font-size:11px;line-height:16px;padding:0 5px;height:18px;border-radius:2px;background:#F4F4F4;color:var(--fg-1);border:1px solid #E6E6E6;border-bottom-width:2px">Q</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;color:var(--fg-0)">
      <span style="width:6px;height:6px;border-radius:50%;background:#1E1E1E"></span>
      <span style="flex:1">new claim</span>
      <span style="font-family:var(--font-mono);font-size:11px;line-height:16px;padding:0 5px;height:18px;border-radius:2px;background:#F4F4F4;color:var(--fg-1);border:1px solid #E6E6E6;border-bottom-width:2px">C</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;color:var(--fg-0)">
      <span style="width:6px;height:6px;border-radius:50%;background:#8E4EC6"></span>
      <span style="flex:1">new source</span>
      <span style="font-family:var(--font-mono);font-size:11px;line-height:16px;padding:0 5px;height:18px;border-radius:2px;background:#F4F4F4;color:var(--fg-1);border:1px solid #E6E6E6;border-bottom-width:2px">S</span>
    </div>
  </div>
</div>
</div></body></html>
