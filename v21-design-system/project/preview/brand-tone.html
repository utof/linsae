<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/>
<title>brand-tone</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<link rel="stylesheet" href="_shell.css"/>
</head><body><div class="card-root"><div class="col" style="gap:14px;width:100%">
    <div class="row" style="gap:14px">
      <div style="flex:1;background:#fff;border:1px solid var(--border-0);border-radius:6px;padding:12px">
        <div class="muted" style="margin-bottom:6px;color:#30A46C">we say</div>
        <div style="font-size:13px;color:var(--fg-0);line-height:1.5">add a question</div>
        <div style="font-size:13px;color:var(--fg-0);line-height:1.5">you have 3 open questions</div>
        <div style="font-size:13px;color:var(--fg-0);line-height:1.5">marked confident.</div>
      </div>
      <div style="flex:1;background:#fff;border:1px solid var(--border-0);border-radius:6px;padding:12px">
        <div class="muted" style="margin-bottom:6px;color:#E5484D">we don't say</div>
        <div style="font-size:13px;color:var(--fg-3);line-height:1.5;text-decoration:line-through">✨ Capture a new thought!</div>
        <div style="font-size:13px;color:var(--fg-3);line-height:1.5;text-decoration:line-through">We found 3 questions for you</div>
        <div style="font-size:13px;color:var(--fg-3);line-height:1.5;text-decoration:line-through">Success! 🎉</div>
      </div>
    </div>
  </div></div></body></html>
