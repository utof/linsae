<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>canvas spike</title>
    <link rel="stylesheet" href="../../../node_modules/katex/dist/katex.min.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #fafafa;
      }
      #viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .card {
        position: absolute;
        width: 280px;
        height: 200px;
        overflow: hidden;
        box-sizing: border-box;
        padding: 10px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        font: 13px/1.4 sans-serif;
      }
      .card h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      .card.cv {
        content-visibility: auto;
        contain-intrinsic-size: 280px 200px;
      }
      #dots {
        position: absolute;
        inset: 0;
        display: none;
      }
      #hud {
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 10;
        padding: 6px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #0f0;
        font: 12px monospace;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><div id="world"></div><canvas id="dots"></canvas></div>
    <div id="hud"></div>
    <script src="../../../node_modules/katex/dist/katex.min.js"></script>
    <script src="./harness.js"></script>
    <script src="./cards.js"></script>
    <script src="./dots.js"></script>
    <script src="./ink.js"></script>
  </body>
</html>
