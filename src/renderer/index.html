<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>linsae</title>
    <!-- _media images are same-origin (relative /_media/<yyyy>/<mm>/<sha>.png):
         in prod the loopback HTTP shell serves both the renderer bundle and /_media/
         on the same http://127.0.0.1:<port> origin; in dev the Vite server proxies
         /_media/ to the loopback shell's fixed port. 'self' covers all three cases;
         the former app: token is removed as app:// is no longer the document origin. -->
    <!-- The YouTube player is now an Electron <webview> (ADR 0016), not an iframe.
         The webview runs in a separate browsing context governed by will-attach-webview
         and will-navigate guards in the main process — the renderer CSP does NOT apply
         to its frame or scripts. The former frame-src and script-src YouTube tokens are
         therefore dead and have been removed. img-src keeps the ytimg.com thumbnail
         hosts because those images are fetched by the renderer itself (not the webview). -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https://i.ytimg.com https://*.ytimg.com; script-src 'self'; worker-src 'self' blob:;" />
    <!-- Boot splash: a zero-JS skeleton painted on the FIRST frame so the window
         (show:false → ready-to-show) appears immediately instead of waiting for
         the whole JS module graph (React + markdown + KaTeX) to load and mount.
         It lives OUTSIDE React's #root, so createRoot leaves it untouched; App
         removes it (crossfade) once the notes query settles — covering both the
         module-load gap and the notes-IPC gap with one skeleton. Colors are
         hardcoded (not v21 CSS vars) because in dev the token CSS is injected by
         JS and isn't present at this first paint. style-src allows inline CSS;
         script-src forbids inline JS, so the skeleton is pure HTML+CSS. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 90000; background: #ffffff;
        display: flex; flex-direction: column;
        opacity: 1; transition: opacity 0.32s ease;
      }
      #boot-splash.boot-splash--hide { opacity: 0; pointer-events: none; }
      #boot-splash .bs-topbar { height: 40px; flex: 0 0 auto; background: #fafafa; border-bottom: 1px solid #e6e6e6; }
      #boot-splash .bs-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 32px; }
      #boot-splash .bs-feed {
        flex: 1; width: 100%; max-width: 720px; margin: 0 auto;
        display: flex; flex-direction: column; justify-content: flex-end;
        gap: 14px; padding-bottom: 18px;
      }
      #boot-splash .bs-composer { width: 100%; max-width: 720px; margin: 0 auto 20px; height: 56px; border-radius: 10px; background: #fafafa; border: 1px solid #e6e6e6; }
      #boot-splash .bs-bubble {
        height: 30px; border-radius: 8px;
        background-image: linear-gradient(90deg, #f4f4f4 0%, #ececec 40%, #f4f4f4 80%);
        background-size: 300% 100%; animation: bs-shimmer 1.4s ease-in-out infinite;
      }
      #boot-splash .bs-tall { height: 64px; }
      @keyframes bs-shimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bs-bubble { animation: none; } }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="bs-topbar"></div>
      <div class="bs-body">
        <div class="bs-feed">
          <div class="bs-bubble" style="width: 62%"></div>
          <div class="bs-bubble" style="width: 80%"></div>
          <div class="bs-bubble bs-tall" style="width: 54%"></div>
          <div class="bs-bubble" style="width: 72%"></div>
          <div class="bs-bubble" style="width: 44%"></div>
        </div>
        <div class="bs-composer"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
